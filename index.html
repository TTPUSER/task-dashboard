<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Daily Task & Activity Control Dashboard (Full-Screen v2)</title>
<style>
  :root {
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --bg-slate-900: #0f172a;
    --bg-slate-800: #1e293b;
    --bg-slate-100: #f1f5f9;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --indigo-600: #4f46e5;
    --indigo-500: #6366f1;
    --indigo-50: #eef2ff;
    --emerald-bg: #dcfce7;
    --emerald-fg: #166534;
    --blue-bg: #dbeafe;
    --blue-fg: #1e40af;
    --amber-bg: #fef3c7;
    --amber-fg: #92400e;
    --red-bg: #fee2e2;
    --red-fg: #991b1b;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    --radius-lg: 14px;
    --radius-md: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.45;
  }
  body {
    padding-bottom: 36px;
  }

  /* Header Bar */
  header {
    background: linear-gradient(135deg, var(--bg-slate-900) 0%, var(--bg-slate-800) 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 0;
    z-index: 50;
    width: 100%;
  }
  .brand-title h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-title p {
    font-size: 0.8rem;
    color: #cbd5e1;
    margin-top: 2px;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 5px 12px;
    border-radius: 8px;
    color: #fff;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-badge input[type="date"] {
    background: transparent;
    border: none;
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    outline: none;
  }
  .date-badge input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--indigo-600);
    color: #fff;
  }
  .btn-primary:hover { background: var(--indigo-500); }
  .btn-ghost {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.2); }

  /* Full-Screen Container & Navigation Bar */
  .container {
    width: 100%;
    max-width: 100%;
    margin: 16px auto 0;
    padding: 0 24px;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
    width: 100%;
  }
  @media (max-width: 960px) {
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .kpi-card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    min-width: 0;
  }
  .kpi-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--indigo-600);
  }
  .kpi-card.todo::before { background: #64748b; }
  .kpi-card.doing::before { background: #2563eb; }
  .kpi-card.blocked::before { background: #dc2626; }
  .kpi-card.done::before { background: #16a34a; }
  .kpi-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .kpi-value {
    font-size: 1.65rem;
    font-weight: 800;
    margin-top: 4px;
    color: var(--text-main);
  }
  .kpi-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* View Switcher Tabs */
  .tabs-bar {
    display: flex;
    gap: 6px;
    background: var(--bg-slate-100);
    padding: 5px;
    border-radius: var(--radius-md);
    width: fit-content;
    margin-bottom: 16px;
    border: 1px solid var(--border-color);
  }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn.active {
    background: var(--bg-card);
    color: var(--indigo-600);
    box-shadow: var(--shadow-sm);
  }

  .view-panel { display: none; width: 100%; }
  .view-panel.active { display: block; width: 100%; }

  /* 1. Calendar View Layout - Strictly Non-Overflowing Grid */
  .calendar-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 16px;
    width: 100%;
    align-items: start;
  }
  @media (max-width: 1100px) {
    .calendar-layout { grid-template-columns: minmax(0, 1fr); }
  }
  .card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    padding: 16px 18px;
    min-width: 0;
    width: 100%;
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .cal-header h2 {
    font-size: 1.15rem;
    font-weight: 700;
  }
  .cal-nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .cal-nav button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .cal-nav button:hover { background: var(--bg-slate-100); }

  /* Critical fix: minmax(0, 1fr) prevents long task names from expanding calendar columns */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
  }
  .cal-dow {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 6px 0;
  }
  .cal-day {
    min-height: 98px;
    min-width: 0;
    border: 1px solid var(--border-color);
    border-radius: 9px;
    padding: 6px;
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .cal-day:hover {
    border-color: var(--indigo-500);
    box-shadow: var(--shadow-sm);
  }

    background: #
